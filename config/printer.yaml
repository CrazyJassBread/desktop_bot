# ESP32 thermal printer used by the voice-triggered photo feature.
# When disabled, voice-triggered photos are still captured and saved but
# nothing is sent to the printer.

printer:
  enabled: false
  # Base URL of the ESP32 printer HTTP server, e.g. http://10.76.10.141
  base_url: "http://10.76.14.192"
  timeout_seconds: 30.0
  # Pixel-art processing applied before printing.
  pixel_size: 4
  grayscale_levels: 4
  contrast: 1.2
  brightness: 1.0
  dither: true
  rotate_180: false
  # Images taller than this are split into chunks before upload.
  max_chunk_height: 1200
  # Print LLM Q&A answers on letter stationery. Uses the ui letter
  # template when the ui server is reachable, otherwise falls back to
  # a simplified local rendering.
  print_answers: false
  # Font used by the local fallback rendering (needs CJK glyphs).
  font_path: "/System/Library/Fonts/Hiragino Sans GB.ttc"
  # maxBatchHeight passed to the ui renderer (clamped to 360-960).
  letter_batch_height: 900
