# Voice keywords. Keywords create explicit intents; in chat mode, unmatched
# ASR text is routed to the chat feature as a question.

keywords:
  wake:
    - 小P
    - 小皮
    - 小屁
    - 小批
  enter_chat:
    - 进入聊天模式
    - 开始聊天
  exit_chat:
    - 退出聊天模式
    - 结束聊天
    - 返回普通模式
  # Letter dictation session: collected speech is polished by the LLM.
  # Traditional-Chinese variants cover ASR output drift; English phrases
  # keep the features reachable while transcription runs in English mode.
  write_letter:
    - 开始写信
    - 開始寫信
    - 帮我写信
    - 幫我寫信
    - 我要写一封信
    - 写信
    - 寫信
    - write a letter
    - start a letter
  end_letter:
    - 结束写信
    - 結束寫信
    - 写完了
    - 寫完了
    - 信写完了
    - 信寫完了
    - finish the letter
    - letter is done
  # Q&A dictation session: the LLM answers the dictated question.
  start_qa:
    - 我有一个问题
    - 我有一個問題
    - 智能问答
    - 智能問答
    - 请回答我的问题
    - 請回答我的問題
    - I have a question
  end_qa:
    - 结束问答
    - 結束問答
    - 问完了
    - 問完了
    - end of question
    - question is done
  # Voice-triggered photo: capture the camera frame shortly after the
  # keyword and send the pixelated result to the thermal printer.
  # Longer phrases come first so plain "拍照" is only the fallback.
  take_photo:
    - 帮我拍照
    - 幫我拍照
    - 拍张照
    - 拍張照
    - 拍照
    - take a photo
    - take a picture
  # Spoken language toggle: switches ASR transcription and LLM output
  # between Chinese and English.
  switch_to_english:
    - 切换英文
    - 切換英文
    - 切换到英文
    - 切换英语
    - 英文模式
    - switch to English
    - English mode
  switch_to_chinese:
    - 切换中文
    - 切換中文
    - 切换到中文
    - 中文模式
    - switch to Chinese
    - Chinese mode
  # Future voice entry points can be registered without changing ASR code:
  # custom:
  #   music.open:
  #     - 打开音乐
  custom: {}
