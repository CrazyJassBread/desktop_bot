audio:
  target_sample_rate: 16000

asr:
  backend: faster_whisper
  model: models/faster-whisper-small
  model_dir: models
  device: cpu
  compute_type: int8
  language: zh

# Bot protocols:
# - TCP 8080: PCM s16le, 16 kHz, mono
# - HTTP 8081: POST /upload with a 640x480 JPEG body
hardware:
  audio_enabled: true
  audio_host: 0.0.0.0
  audio_port: 8080
  audio_frame_samples: 512
  audio_queue_size: 256
  vision_enabled: true
  vision_host: 0.0.0.0
  vision_port: 8081
  vision_upload_path: /upload
  session_id: bot

vad:
  enabled: true
  backend: silero
  model: bundled
  speech_threshold: 0.60
  release_threshold: 0.35
  min_speech_duration_ms: 250
  min_silence_duration_ms: 800
  pre_roll_ms: 200
  max_utterance_seconds: 60

# Keywords create explicit intents. In chat mode, unmatched ASR text is routed
# to the chat feature as a question.
keywords:
  wake:
    - 小A
    - 小爱
    - 小诶
  enter_chat:
    - 进入聊天模式
    - 开始聊天
    - 智能问答
  exit_chat:
    - 退出聊天模式
    - 结束聊天
    - 返回普通模式
  write_letter:
    - 帮我写信
    - 我要写一封信
  photo_print:
    - 拍照
    - 照相
    - 给我拍一张
    - 打印照片
    - photo
    - take a photo
    - take a picture

perception:
  event_cache_capacity: 100
  event_ttl_seconds: 1800
  utterance_queue_size: 4
  vision_max_fps: 5

vision:
  enabled: true
  backend: mediapipe
  gesture_model: models/gesture_recognizer.task
  image_width: 640
  image_height: 480
  max_image_bytes: 2097152
  max_hands: 2
  score_threshold: 0.70
  mode_window_size: 3
  mode_required_hits: 2
  release_frames: 2
  gesture_window_size: 3
  gesture_required_hits: 2

application:
  default_language: zh
  photo_enabled: true
  photo_delay_seconds: 1.0
  photo_frame_max_age_seconds: 1.0
  photo_output_dir: captured_photos
  # Set this to the AI photo service's multipart HTTP endpoint.
  photo_processor_url: ""
  downstream_timeout_seconds: 10.0

printer:
  enabled: true
  base_url: http://10.76.11.223
  width: 384
  max_chunk_height: 1200
  pixel_size: 6
  grayscale_levels: 4
  contrast: 1.2
  brightness: 1.0
  dither: true
  rotate_180: false
  timeout_seconds: 30
  cooldown_seconds: 2.0

# OLED expression endpoint on the Bot ESP.
# Persistent expressions: happy, angry, tired, default.
# Two-second actions: blink, laugh, confused.
bot_expression:
  enabled: true
  base_url: http://10.76.11.223
  endpoint: /oled/expression
  timeout_seconds: 5
  action_duration_seconds: 2

# Slowly-inspired monochrome letter layout. Completed LLM letters are rendered
# to a PNG preview and sent through the crisp text-printing path.
letter:
  enabled: true
  auto_print: true
  output_dir: generated_letters
  # Leave empty to discover Songti/Noto CJK. Set explicitly on Linux if needed.
  font_path: ""
  stamp_selection: random
  stamp_themes:
    - flower
    - moon
    - envelope
  postmark_style: wave_date
  show_signature: true
  max_print_characters: 2000

llm:
  enabled: true
  timeout_seconds: 60
  temperature: 0.4
  max_output_tokens: 2000
  log_path: logs/llm.log
  user_nickname: 用户
  session:
    idle_timeout_seconds: 120
    max_duration_seconds: 900
    max_characters: 12000
    body_prefixes:
      - "正文："
      - "正文:"
  modes:
    letter:
      start_phrases:
        - 开始写信
        - 我要写信
        - 帮我写信
        - 我要写一封信
      recipient_templates:
        - 我要给{recipient}写信
        - 帮我给{recipient}写封信
      recipient_prefixes:
        - 收件人是
        - 写给
        - 收信人是
      finish_phrases:
        - 小A，完成写信
        - 小A，信写完了
        - 完成写信
        - 信写完了
        - 写信完成
      cancel_phrases:
        - 小A，取消写信
        - 小A，放弃这封信
    qa:
      start_phrases:
        - 进入问答模式
        - 我有一个问题
        - 帮我回答
      finish_phrases:
        - 小A，请回答
        - 小A，问题说完了
      cancel_phrases:
        - 小A，取消问答
        - 小A，不要回答了

api:
  enabled: true
  host: 0.0.0.0
  port: 8090
  websocket_path: /api/events
