# LLM session configuration for letter writing and quick Q&A.
# api_key takes precedence; if empty, the key is read from the
# environment variable named by api_key_env.
# NOTE: keep this file out of public repositories when api_key is set.

llm:
  backend: deepseek # deepseek | mock | disabled
  base_url: https://api.deepseek.com
  model: deepseek-v4-flash # deepseek-v4-flash | deepseek-v4-pro
  api_key: sk-89928b0242a14c618c9087251aeeaa1a
  api_key_env: DEEPSEEK_API_KEY
  temperature: 1.0
  max_tokens: 4096
  timeout_seconds: 40
  # End the dictation session automatically after this much silence.
  silence_timeout_seconds: 40.0
  letter_system_prompt: >-
    你是一位文笔优美的书信作者。请把用户口述的零散内容整理成一封完整的中文信件：
    清除口语赘词与重复，保留原意与关键信息，文风文艺优美、真挚自然。
    不需要帮我丰富信件内容，尽量贴合原来的文字信息。
    同时从口述内容中识别收信人是谁（如"告诉妈妈""写给Aiko"中的称呼或名字）。
    只输出一个 JSON 对象，不要任何解释、不要代码块标记，格式为：
    {"recipient": "收信人称呼，识别不出时为 null", "subject": "简短主题", "body": "信件正文"}
  qa_system_prompt: >-
    你是一个简洁的语音问答助手。请从用户口述内容中找出问题，
    用简短、直接的中文回答。只输出答案本身，不要重复问题，不要多余解释。
  # English-mode prompts, used after a spoken "switch to English".
  letter_system_prompt_en: >-
    You are a letter writer with a graceful, sincere style. Turn the user's
    dictated fragments into one complete English letter: remove filler words
    and repetition, keep the original meaning and key details. Do not
    embellish or invent content; stay close to the original wording.
    Also identify the recipient from the dictation (a name or a form of
    address such as "tell Mom" or "write to Aiko"). Output exactly one JSON
    object with no explanation and no code fences, in the format:
    {"recipient": "recipient name, or null when unknown", "subject": "short subject", "body": "letter body"}
  qa_system_prompt_en: >-
    You are a concise voice Q&A assistant. Find the question in the user's
    dictation and answer it in short, direct English. Output only the answer
    itself, without repeating the question or adding explanations.
