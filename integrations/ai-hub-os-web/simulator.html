<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#181b1b">
    <title>MIMO One · Device Simulator</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <style>
      body { color: #e8ebe7; background: #161918; }
      .sim-shell { width: min(1180px, 100%); margin: 0 auto; padding: 28px; }
      .sim-head { display:flex; align-items:center; justify-content:space-between; gap:20px; margin-bottom:25px; }
      .sim-brand { display:flex; align-items:center; gap:12px; }
      .sim-brand .brand-mark { border-color:#dfe3df; background:#242827; }
      .sim-brand .brand-mark::before { background:#dfe3df; }.sim-brand .brand-mark::after { background:#222; box-shadow:7px 0 #222; }
      .sim-brand strong { display:block; font-size:15px; letter-spacing:.1em; }.sim-brand small { color:#89908b; font-size:8px; letter-spacing:.12em; }
      .sim-link { padding:9px 13px; border:1px solid #343938; border-radius:10px; color:#c4cac5; background:#212524; font-size:9px; }
      .sim-grid { display:grid; grid-template-columns:minmax(340px,.9fr) minmax(480px,1.25fr); gap:18px; }
      .sim-card { border:1px solid #303533; border-radius:22px; background:#202423; box-shadow:0 25px 60px rgba(0,0,0,.22); }
      .sim-device-stage { position:relative; display:grid; place-items:center; min-height:540px; overflow:hidden; background:radial-gradient(circle at 50% 34%, #343c3c, #1d2120 58%); }
      .sim-device-stage::after { content:""; position:absolute; inset:0; opacity:.14; background-image:radial-gradient(#fff .7px,transparent .7px); background-size:7px 7px; }
      .sim-state { position:absolute; z-index:4; top:20px; left:20px; display:flex; align-items:center; gap:8px; padding:8px 11px; border-radius:999px; background:#2a302e; font-size:8px; text-transform:uppercase; letter-spacing:.08em; }
      .sim-state i { width:7px; height:7px; border-radius:50%; background:#71bb84; box-shadow:0 0 0 4px rgba(113,187,132,.11); }
      .sim-stage-device { position:relative; z-index:2; transform:scale(1.65); }
      .sim-telemetry { position:absolute; z-index:4; right:18px; bottom:18px; left:18px; display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
      .sim-telemetry span { display:grid; padding:10px; border-radius:11px; background:rgba(38,44,42,.86); backdrop-filter:blur(10px); }
      .sim-telemetry small { color:#808883; font-size:7px; }.sim-telemetry strong { margin-top:3px; font-size:10px; }
      .sim-console { display:grid; gap:18px; }
      .sim-controls { padding:22px; }
      .sim-card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:17px; }
      .sim-card-head h2 { margin:0; font-size:14px; }.sim-card-head span { color:#78817b; font-size:8px; }
      .sim-button-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
      .sim-button-grid button, .gesture-buttons button { min-height:58px; padding:8px; border:1px solid #363c39; border-radius:12px; color:#d9ded9; background:#292e2c; font-size:8px; font-weight:700; }
      .sim-button-grid button:hover, .gesture-buttons button:hover { border-color:#59635e; background:#313735; }
      .sim-button-grid .danger { color:#e9a79e; background:#322725; }
      .sim-mid-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
      .sim-printer, .sim-camera { min-height:250px; padding:19px; }
      .printer-slot { height:13px; margin:0 auto; border-radius:7px; background:#0e1010; box-shadow:inset 0 2px 5px #000; }
      .receipt { position:relative; width:84%; min-height:0; max-height:0; margin:0 auto; padding:0 18px; overflow:hidden; color:#252620; background:#eae2c9; font-family:ui-monospace,monospace; transition:max-height .8s,padding .8s; }
      .receipt.printing { max-height:190px; padding:18px; }.receipt::after { content:"· · · · · · · · · ·"; position:absolute; right:0; bottom:7px; left:0; color:#948d78; font-size:7px; text-align:center; }
      .receipt small { display:block; color:#817b68; font-size:6px; }.receipt strong { display:block; margin:15px 0 25px; font-size:9px; line-height:1.7; white-space:pre-wrap; }
      .camera-frame { position:relative; display:grid; place-items:center; height:170px; overflow:hidden; border-radius:14px; background:linear-gradient(160deg,#344249,#1d2527); }
      .camera-frame::before { content:""; position:absolute; inset:18px; border:1px solid rgba(190,221,222,.22); border-radius:9px; }
      .camera-reticle { width:38px; height:38px; border:1px solid #b6d4d2; border-radius:50%; opacity:.65; }
      .camera-frame.captured { animation:flash .35s; } @keyframes flash { 50% { filter:brightness(3); } }
      .gesture-card { padding:19px; }.gesture-buttons { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }.gesture-buttons button span { display:block; margin-bottom:5px; font-size:20px; }
      .sim-log-card { padding:19px; }.sim-log { height:155px; overflow:auto; padding:12px; border-radius:12px; background:#151817; font:8px/1.7 ui-monospace,monospace; }.sim-log p { margin:0; color:#879089; }.sim-log time { color:#59635e; }.sim-log b { color:#aec6b5; font-weight:500; }
      @media(max-width:850px){.sim-grid{grid-template-columns:1fr}.sim-device-stage{min-height:440px}.sim-mid-grid{grid-template-columns:1fr}.sim-shell{padding:16px}.sim-button-grid,.gesture-buttons{grid-template-columns:repeat(2,1fr)}}
    </style>
  </head>
  <body>
    <main class="sim-shell">
      <header class="sim-head">
        <div class="sim-brand"><span class="brand-mark"><i></i><i></i></span><span><strong>MIMO ONE</strong><small>ESP32-S3 DEVICE SIMULATOR</small></span></div>
        <button class="sim-link" id="open-web">打开 Web 控制台 ↗</button>
      </header>
      <div class="sim-grid">
        <section class="sim-card sim-device-stage">
          <div class="sim-state"><i></i><span id="sim-mode-label">IDLE · CONNECTED</span></div>
          <div class="sim-stage-device" id="sim-device-avatar"></div>
          <div class="sim-telemetry"><span><small>BATTERY</small><strong id="sim-battery">82%</strong></span><span><small>LANGUAGE</small><strong id="sim-language">CN</strong></span><span><small>WI-FI</small><strong>-42 dBm</strong></span></div>
        </section>
        <div class="sim-console">
          <section class="sim-card sim-controls">
            <div class="sim-card-head"><h2>Hardware controls</h2><span>FSM · local bus v1</span></div>
            <div class="sim-button-grid">
              <button data-command="wake">WAKE<br>唤醒</button><button data-command="idle">IDLE<br>待机</button><button data-command="listen">MIC<br>录音</button><button data-command="photo">CAMERA<br>拍照</button>
              <button data-command="print">PRINT<br>测试打印</button><button data-command="game">GAME<br>游戏</button><button data-command="sleep">SLEEP<br>睡眠</button><button class="danger" data-command="shutdown">OFF<br>软关机</button>
            </div>
          </section>
          <div class="sim-mid-grid">
            <section class="sim-card sim-printer">
              <div class="sim-card-head"><h2>Thermal printer</h2><span id="printer-status">READY</span></div>
              <div class="printer-slot"></div>
              <div class="receipt" id="receipt"><small>MIMO / PRINT JOB</small><strong id="receipt-content">等待打印任务</strong></div>
            </section>
            <section class="sim-card sim-camera">
              <div class="sim-card-head"><h2>Camera</h2><span id="camera-status">READY</span></div>
              <div class="camera-frame" id="camera-frame"><span class="camera-reticle"></span></div>
            </section>
          </div>
          <section class="sim-card gesture-card">
            <div class="sim-card-head"><h2>Gesture input</h2><span>MediaPipe event mock</span></div>
            <div class="gesture-buttons"><button data-gesture="v_sign"><span>✌</span>V · LANGUAGE</button><button data-gesture="open_palm"><span>✋</span>PALM · PHOTO</button><button data-gesture="up"><span>☝</span>UP · JUMP</button><button data-gesture="down"><span>👇</span>DOWN · DUCK</button></div>
          </section>
          <section class="sim-card sim-log-card">
            <div class="sim-card-head"><h2>Realtime event log</h2><span id="message-count">0 EVENTS</span></div>
            <div class="sim-log" id="sim-log"></div>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="/simulator.js"></script>
  </body>
</html>
