audio:
  target_sample_rate: 16000

asr:
  backend: faster_whisper
  model: models/faster-whisper-small
  model_dir: models
  device: cpu
  compute_type: int8
  language: zh

# Bot protocols:
# - TCP 8080: PCM s16le, 16 kHz, mono
# - HTTP 8081: POST /upload with a 640x480 JPEG body
hardware:
  audio_enabled: true
  audio_host: 0.0.0.0
  audio_port: 8080
  audio_frame_samples: 512
  audio_queue_size: 256
  vision_enabled: true
  vision_host: 0.0.0.0
  vision_port: 8081
  vision_upload_path: /upload
  session_id: bot

vad:
  enabled: true
  backend: silero
  model: bundled
  speech_threshold: 0.60
  release_threshold: 0.35
  min_speech_duration_ms: 250
  min_silence_duration_ms: 800
  pre_roll_ms: 200
  max_utterance_seconds: 60

# ASR text is discarded unless one of these phrases is present.
keywords:
  wake:
    - 小A
    - 小爱
    - 小诶
  enter_chat:
    - 进入聊天模式
    - 开始聊天
    - 智能问答
  exit_chat:
    - 退出聊天模式
    - 结束聊天
    - 返回普通模式
  write_letter:
    - 帮我写信
    - 我要写一封信

perception:
  event_cache_capacity: 100
  event_ttl_seconds: 1800
  utterance_queue_size: 4
  vision_max_fps: 5

vision:
  enabled: true
  backend: mediapipe
  gesture_model: models/gesture_recognizer.task
  image_width: 640
  image_height: 480
  max_image_bytes: 2097152
  max_hands: 2
  score_threshold: 0.70
  mode_window_size: 5
  mode_required_hits: 3
  release_frames: 2
  gesture_window_size: 3
  gesture_required_hits: 2
