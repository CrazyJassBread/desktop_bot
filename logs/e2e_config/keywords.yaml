# Voice keywords. Keywords create explicit intents; in chat mode, unmatched
# ASR text is routed to the chat feature as a question.

keywords:
  wake:
    - 小P
    - 小皮
    - 小屁
    - 小批
  enter_chat:
    - 进入聊天模式
    - 开始聊天
  exit_chat:
    - 退出聊天模式
    - 结束聊天
    - 返回普通模式
  # Letter dictation session: collected speech is polished by the LLM.
  # Traditional-Chinese variants cover ASR output drift.
  write_letter:
    - 开始写信
    - 開始寫信
    - 帮我写信
    - 幫我寫信
    - 我要写一封信
  end_letter:
    - 结束写信
    - 結束寫信
    - 写完了
    - 寫完了
    - 信写完了
    - 信寫完了
  # Q&A dictation session: the LLM answers the dictated question.
  start_qa:
    - 我有一个问题
    - 我有一個問題
    - 智能问答
    - 智能問答
    - 请回答我的问题
    - 請回答我的問題
  end_qa:
    - 结束问答
    - 結束問答
    - 问完了
    - 問完了
  # Future voice entry points can be registered without changing ASR code:
  # custom:
  #   music.open:
  #     - 打开音乐
  custom: {}
